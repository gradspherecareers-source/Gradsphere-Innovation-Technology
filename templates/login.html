{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<section class="auth"><div class="container auth-grid">
  <div class="auth-side"><h2>Welcome back</h2><p>Log in to track your projects, documents and requests.</p>
    <ul class="ticks light"><li>Track project progress</li><li>Download delivered files</li><li>Request new services</li></ul></div>
  <form method="post" class="card form">
    <h3>Client Login</h3>
    <input type="email" name="email" placeholder="Email address" required>
    <input type="password" name="password" placeholder="Password" required>
    <button class="btn" type="submit">Login</button>
    <p class="small">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </form>
</div></section>
{% endblock %}
