{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<section class="auth"><div class="container auth-grid">
  <div class="auth-side">
    <h2>Password Recovery</h2>
    <p>Enter your registered email address and we'll send you a 6-digit OTP code to reset your password.</p>
  </div>
  <form method="post" class="card form">
    <h3>Reset Password</h3>
    <input type="email" name="email" placeholder="Enter your email address *" required>
    <button class="btn" type="submit">Send OTP Code</button>
    <p class="small" style="margin-top: 12px;"><a href="{{ url_for('login') }}">← Back to Login</a></p>
  </form>
</div></section>
{% endblock %}
